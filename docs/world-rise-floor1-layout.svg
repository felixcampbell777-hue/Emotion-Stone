<text x="380" y="111" fill="#20372d" font-size="18" font-family="sans-serif">N</text><path d="M385 120 v20 m-5 -13 5 -7 5 7" stroke="#20372d" stroke-width="2" fill="none"/><g font-family="sans-serif" fill="#dae8dd"><text x="730" y="150" font-size="21" fill="#f3e6c2">Route and encounter intent</text><text x="730" y="190" font-size="16">16–20 boar groups, 2–4 each</text><text x="730" y="220" font-size="16">4–5 coordinated wolf packs</text><text x="730" y="250" font-size="16">Forest: about 1/8 of land</text><text x="730" y="280" font-size="16">Ridges overlook sheltered valleys</text><text x="730" y="310" font-size="16">Optional ruin and treasure loops</text><text x="730" y="370" font-size="21" fill="#f3e6c2">Edge of the floor</text><text x="730" y="410" font-size="16">Walkable rise into worn metal</text><text x="730" y="440" font-size="16">Outer lip falls into sunny abyss</text><text x="730" y="470" font-size="16">Distant mountain backdrop</text><text x="730" y="530" font-size="21" fill="#f3e6c2">Schematic only</text><text x="730" y="570" font-size="16">Contours suggest broad hills.</text><text x="730" y="600" font-size="16">Dots illustrate group spacing;</text><text x="730" y="625" font-size="16">they are not all final spawns.</text></g><path d="M140 705 h119 m-119 -5 v10 m119 -10 v10" stroke="#d8e3d6" stroke-width="2"/><text x="170" y="730" fill="#d8e3d6" font-size="15" font-family="sans-serif">100m</text></svg>